name: CI

on:
  push:
    branches: [ main, feature/onboarding-profile-interests ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        run: npm install -g pnpm@10.15.1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Test authentication callback
        run: node --test scripts/tests/auth-callback.test.cjs

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Build web
        run: pnpm --filter @workspace/web run build

      - name: Build api-server
        run: pnpm --filter @workspace/api-server run build

      - name: Check mobile typecheck
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: tokvid-web-build
          path: artifacts/web/.next
          include-hidden-files: true
          if-no-files-found: error
