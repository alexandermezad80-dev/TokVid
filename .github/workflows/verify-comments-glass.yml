name: Verify comments glass preview (no APK)
on:
  push:
    branches: [feature/comments-glass-reference-stage2-3]
  workflow_dispatch:
concurrency:
  group: verify-comments-glass-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated staging branch
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        run: pnpm install
      - name: Run all existing behavior tests
        run: node --test scripts/tests/*.test.cjs
      - name: Typecheck mobile
        run: pnpm --filter @workspace/mobile run typecheck
