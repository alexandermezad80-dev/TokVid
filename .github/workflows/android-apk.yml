name: Android APK

on:
  push:
    branches: [ feature/onboarding-profile-interests ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        run: npm install -g pnpm@10.15.1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install dependencies
        run: pnpm install

      - name: Normalize Expo PNG assets
        working-directory: artifacts/mobile
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          magick assets/images/icon.png -strip -define png:color-type=6 -define png:bit-depth=8 /tmp/tokvid-icon.png
          mv /tmp/tokvid-icon.png assets/images/icon.png

      - name: Generate Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokvid-android-release
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
