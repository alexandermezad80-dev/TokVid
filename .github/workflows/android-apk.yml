name: Android APK

on:
  push:
    branches: [ feature/onboarding-profile-interests ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Install dependencies
        run: pnpm install

      - name: Normalize Expo PNG assets
        working-directory: artifacts/mobile
        run: |
          python3 -m pip install --user --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path("assets/images/icon.png")
          with Image.open(p) as im:
              im.convert("RGBA").save(p, format="PNG", optimize=True)
          PY

      - name: Generate Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --clean --non-interactive --no-install

      - name: Configure Gradle memory
        working-directory: artifacts/mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle.properties")
          import re
          raw = p.read_text()
          # expo-build-properties can leave the next Gradle property attached to
          # android.minSdkVersion=24; split it before applying our settings.
          raw = re.sub(r"(\\d)(org\\.gradle\\.)", r"\\1\\n\\2", raw)
          lines = raw.splitlines()
          lines = [line for line in lines if not line.startswith("org.gradle.jvmargs=")]
          lines = [line for line in lines if not line.startswith("org.gradle.workers.max=")]
          lines = [line for line in lines if not line.startswith("org.gradle.daemon=")]
          lines += [
              "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
              "org.gradle.workers.max=2",
              "org.gradle.daemon=false",
          ]
          p.write_text("\n".join(lines) + "\n")
          PY

      - name: Build standalone release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokvid-android-release
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
