name: Android APK

on:
  push:
    branches: [ feature/feed-mini-video-avatar ]
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    if: github.ref == 'refs/heads/feature/feed-mini-video-avatar' && !contains(github.event.head_commit.message, '[prepare only]')
    environment: production
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: 1
      EXPO_PUBLIC_AUTH_DIAGNOSTICS: '1'
      EXPO_PUBLIC_AUTH_DIAGNOSTIC_BUILD: ${{ github.sha }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify Supabase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then echo "EXPO_PUBLIC_SUPABASE_URL: EMPTY"; else echo "EXPO_PUBLIC_SUPABASE_URL: SET"; fi
          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then echo "EXPO_PUBLIC_SUPABASE_ANON_KEY: EMPTY"; else echo "EXPO_PUBLIC_SUPABASE_ANON_KEY: SET"; fi
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}" || { echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is not available to this job."; exit 1; }
          test -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is not available to this job."; exit 1; }
      - name: Free runner disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk/* || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install dependencies
        run: pnpm install

      - name: Test app behavior and diagnostic redaction
        run: node --test scripts/tests/*.test.cjs
      - name: Typecheck mobile app
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Normalize Expo PNG assets
        working-directory: artifacts/mobile
        run: |
          python3 -m pip install --user --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for filename in ("icon.png", "splash.png"):
              p = Path("assets/images") / filename
              with Image.open(p) as im:
                  im.convert("RGBA").save(p, format="PNG", optimize=True)
                  print(f"{filename}: {im.size} -> valid RGBA PNG")
          PY
      - name: Generate Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Restore Android splash resource
        working-directory: artifacts/mobile
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/images/icon.png android/app/src/main/res/drawable/splashscreen_logo.png
          test -s android/app/src/main/res/drawable/splashscreen_logo.png
          echo "Verified: android/app/src/main/res/drawable/splashscreen_logo.png"
      - name: Configure Gradle memory
        working-directory: artifacts/mobile/android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("gradle.properties")
          raw = p.read_text()
          raw = re.sub(r"(\d)(org\.gradle\.)", r"\1\n\2", raw)
          lines = raw.splitlines()
          lines = [line for line in lines if not line.startswith("org.gradle.jvmargs=")]
          lines = [line for line in lines if not line.startswith("org.gradle.workers.max=")]
          lines = [line for line in lines if not line.startswith("org.gradle.daemon=")]
          lines += [
              "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8",
              "org.gradle.workers.max=2",
              "org.gradle.daemon=false",
          ]
          p.write_text("\n".join(lines) + "\n")
          PY
      - name: Build standalone release APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify diagnostic APK and matching source map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          apk = Path("artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk")
          source_map = Path("artifacts/mobile/android/app/build/generated/sourcemaps/react/release/index.android.bundle.map")
          with zipfile.ZipFile(apk) as archive:
              bundle = archive.read("assets/index.android.bundle")
          for marker in ("TOKVID_AUTH_DIAGNOSTICS_V1", os.environ["GITHUB_SHA"]):
              if marker.encode() not in bundle:
                  raise SystemExit("Diagnostic APK verification failed: missing report marker or build SHA")
          if not source_map.is_file() or source_map.stat().st_size == 0:
              raise SystemExit("Matching Hermes source map is missing")
          checksum = hashlib.file_digest(apk.open("rb"), "sha256").hexdigest()
          manifest = {"commit": os.environ["GITHUB_SHA"], "apk_sha256": checksum, "platform": "android", "diagnostics": True}
          Path("auth-diagnostic-build.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print("Diagnostic APK verified; matching source map retained")
          print("APK SHA256:", checksum)
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokvid-android-feed-avatar
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload matching source map
        uses: actions/upload-artifact@v4
        with:
          name: tokvid-auth-diagnostic-sourcemap
          path: |
            artifacts/mobile/android/app/build/generated/sourcemaps/react/release/index.android.bundle.map
            auth-diagnostic-build.json
          if-no-files-found: error

